# Number of classes
nc: 3

# Model scaling factors
depth_multiple: 0.33
width_multiple: 0.50

# -------------------------------------------------
# Backbone
# -------------------------------------------------
backbone:
  [
    [-1, 1, Conv, [64, 3, 2]],           
    [-1, 1, Conv, [128, 3, 2]],          
    [-1, 3, C2f, [128]],                 
    [-1, 1, Conv, [256, 3, 2]],          
    [-1, 6, C2f, [256]],                 # P3
    [-1, 1, Conv, [320, 3, 1]],          
    [-1, 1, Conv, [512, 3, 2]],          
    [-1, 3, C2f, [512]],                 # P4
    [-1, 1, Conv, [768, 3, 1]],          
    [-1, 1, Conv, [1024, 3, 2]],         
    [-1, 3, C2f, [1024]],                
    [-1, 1, SPPF, [1024, 5]],            # P5
  ]

# -------------------------------------------------
# Neck + Detection Head
# -------------------------------------------------
head:
  [
    [11, 1, Conv, [512, 1, 1]],                       
    [12, 1, nn.Upsample, [None, 2, 'nearest']],       
    [7, 1, Conv, [512, 1, 1]],                        
    [[13, 14], 1, Concat, [1]],                       
    [15, 3, C2f, [512]],                              # P4 fused

    [16, 1, Conv, [256, 1, 1]],                       
    [17, 1, nn.Upsample, [None, 2, 'nearest']],       
    [4, 1, Conv, [256, 1, 1]],                        
    [[18, 19], 1, Concat, [1]],                       
    [20, 3, C2f, [256]],                              # P3 fused

    [21, 1, Conv, [256, 3, 2]],                       
    [[22, 16], 1, Concat, [1]],                       
    [23, 3, C2f, [512]],                              # P4 again

    [24, 1, Conv, [512, 3, 2]],                       
    [[25, 11], 1, Concat, [1]],                       
    [26, 3, C2f, [1024]],                             # P5 again

    [[21, 24, 27], 1, Detect, [nc]],                  # Detection heads (P3, P4, P5)
  ]
